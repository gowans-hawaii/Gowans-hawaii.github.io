<style>
:root{
  --bg:#ECF2F0; --surface:#FFFFFF; --ink:#12302B; --muted:#587069; --line:#D3DFDB;
  --hero:#0D5862; --hero-ink:#F4FAF8; --ocean:#0D6672; --ocean-soft:#D4EAEA;
  --c-eat:#C42F49; --c-see:#0D6672; --c-out:#3B7838; --c-chill:#A97A06; --c-all:#12302B;
  --warn-bg:#FBF0DA; --warn-ink:#6F4800;
  --serif:"Young Serif", Georgia, serif;
  --sans:"Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --ease:cubic-bezier(.2,.75,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B1918; --surface:#122725; --ink:#E3EEEB; --muted:#93ABA5; --line:#244340;
    --hero:#0A3C42; --hero-ink:#E8F5F2; --ocean:#52B7C0; --ocean-soft:#16393B;
    --c-eat:#F06C82; --c-see:#52B7C0; --c-out:#82C177; --c-chill:#E5BD4A; --c-all:#E3EEEB;
    --warn-bg:#2C2312; --warn-ink:#F0CC85;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ocean);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto}

/* Hero */
.hero{background:var(--hero);color:var(--hero-ink);padding:calc(env(safe-area-inset-top) + 18px) 20px 22px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.who{font-weight:600;font-size:15px;opacity:.85}
.list-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.14);font-weight:600;font-size:14px;min-height:38px}
.list-btn svg{width:16px;height:16px}
.hero h1{font:400 44px/1 var(--serif);margin:22px 0 8px;letter-spacing:-.01em}
.count{font-size:17px;margin:0;opacity:.92}
.count b{font-weight:700}

/* Voyage strip */
.strip{position:sticky;top:0;z-index:500;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;padding-top:env(safe-area-inset-top)}
.strip::-webkit-scrollbar{display:none}
.track{position:relative;display:flex;gap:4px;padding:10px 20px 10px;width:max-content;margin:0 auto}
.line,.wake{position:absolute;top:44px;height:2px;border-radius:2px}
.line{background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 10px);transform-origin:left;transform:scaleX(0)}
.wake{background:var(--ocean);width:0;transition:width .7s var(--ease)}
.ship{position:absolute;top:33px;left:0;width:30px;height:20px;margin-left:-15px;color:var(--ocean);transition:transform .7s var(--ease);opacity:0;pointer-events:none;z-index:2}
.ship svg{width:100%;height:100%;display:block}
.node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:70px;padding:0 4px 2px;opacity:0;transform:translateY(6px)}
.n-date{font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap}
.n-dotwrap{height:28px;display:grid;place-items:center}
.n-dot{width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted);transition:transform .3s var(--ease),opacity .2s}
.node.sea .n-dot{width:8px;height:8px;border-width:2px;border-style:dotted}
.n-name{font-size:14px;font-weight:600;white-space:nowrap;color:var(--muted);transition:color .2s}
.node.sea .n-name{font-weight:500}
.node.on .n-name{color:var(--ink)}
.node.on .n-dot{opacity:0;transform:scale(.4)}
.node.today .n-date{color:var(--ocean);font-weight:700}
.track.ready .line{transform:scaleX(1);transition:transform .9s var(--ease)}
.track.ready .node{opacity:1;transform:none;transition:opacity .4s var(--ease) var(--d),transform .4s var(--ease) var(--d)}
.track.ready .ship{opacity:1;transition:transform .7s var(--ease),opacity .3s .5s}
.track.intro .ship{transition:transform 1.1s var(--ease) .55s,opacity .3s .5s}
.track.intro .wake{transition:width 1.1s var(--ease) .55s}

/* Day */
main{padding:22px 20px 40px}
.d-date{margin:0;color:var(--muted);font-size:15px}
.d-place{font:400 40px/1.05 var(--serif);margin:4px 0 6px;letter-spacing:-.01em}
.d-line{margin:0;font-size:17px}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 0;padding:0}
.times div{background:var(--surface);border-radius:12px;padding:10px 12px}
.times dt{font-size:12.5px;color:var(--muted)}
.times dd{margin:2px 0 0;font-weight:700;font-size:17px;white-space:nowrap}
.times .back{background:var(--ocean);color:var(--hero-ink)}
@media (prefers-color-scheme: dark){.times .back{color:#06201F}}
.times .back dt{color:inherit;opacity:.85}
.live{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--ocean-soft);color:var(--ocean);font-weight:700}
.getting{display:flex;gap:8px;align-items:flex-start;margin:14px 0 0;font-size:15px;color:var(--muted)}
.getting svg{flex:none;width:18px;height:18px;margin-top:1px}
.heads{list-style:none;margin:12px 0 0;padding:12px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn-ink);font-size:14.5px;display:grid;gap:6px}
.heads li{display:flex;gap:8px}
.heads li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:currentColor;margin-top:8px}

/* Map */
.mapwrap{position:relative;margin:20px -20px 0;padding:0 20px}
#map{position:relative;height:270px;border-radius:16px;overflow:hidden;background:var(--ocean-soft);transition:height .35s var(--ease)}
#mapSvg{display:block;width:100%;height:100%;transform-origin:0 0;will-change:transform;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.m-sea{fill:var(--ocean-soft)}
.m-land{fill:var(--surface);stroke:color-mix(in srgb,var(--ocean) 40%,transparent);stroke-linejoin:round}
.m-casing{fill:none;stroke:var(--surface);stroke-linecap:round;stroke-linejoin:round}
.m-route{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
.m-dot,.m-pier{cursor:pointer}
.m-dot .hit,.m-pier .hit{fill:transparent}
.m-dot .pt{fill:var(--c);stroke:var(--surface);opacity:.55;transition:opacity .2s}
.m-dot.on .pt,.m-dot.sel .pt{opacity:1}
.m-dot .halo{fill:color-mix(in srgb,var(--c) 30%,transparent)}
.m-dot text{fill:var(--surface);font-weight:700;text-anchor:middle;font-family:var(--sans);pointer-events:none}
.m-pier rect{fill:var(--ink)}
.m-anchor *{fill:none;stroke:var(--bg);stroke-width:1.8;stroke-linecap:round}
.intro .m-dot .pt,.intro .m-pier rect{transform-box:fill-box;transform-origin:center;animation:pop .45s var(--ease) backwards;animation-delay:calc(var(--k,0) * 35ms + 150ms)}
@keyframes pop{from{transform:scale(0)}}
.map-tools{position:absolute;top:10px;right:10px;display:flex;gap:6px}
.map-tools button{background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.18);min-height:34px}
.map-tools button[hidden]{display:none}
.m-scale{position:absolute;left:12px;bottom:10px;display:flex;align-items:flex-end;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);pointer-events:none}
.m-scale i{display:block;height:6px;border:2px solid currentColor;border-top:0}
.map-card{position:absolute;left:10px;right:10px;bottom:10px;background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:0 4px 18px rgba(0,0,0,.22);animation:rise .25s var(--ease)}
.map-card b{display:block;font-size:16px;padding-right:30px}
.map-card > span{display:block;color:var(--muted);font-size:13.5px;margin:2px 0 10px}
.map-card > span:last-child{margin-bottom:0}
.mc-row{display:flex;flex-wrap:wrap;gap:6px}
.mc-row a,.mc-row button{font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--bg);text-decoration:none;min-height:34px;display:inline-flex;align-items:center}
.mc-add.on{background:var(--c);color:var(--surface)}
.mc-x{position:absolute;top:6px;right:6px;width:36px;height:36px;font-size:24px;line-height:1;color:var(--muted)}

.m-zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.m-zoom button{width:40px;height:40px;background:var(--surface);color:var(--ink);font-size:22px;font-weight:600;line-height:1}
.m-zoom button + button{border-top:1px solid var(--line)}
.m-zoom button:disabled{color:var(--line)}
.map-cap{margin:8px 2px 0;font-size:13px;color:var(--muted)}
.mapwrap.big #map{height:62vh}
.map-size{position:absolute;left:30px;bottom:10px;z-index:2;background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:600;padding:7px 12px;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.18);min-height:34px}
.pin-wrap{background:none;border:0}
.pin{display:block;width:22px;height:22px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.3);animation:drop .45s var(--ease) backwards;animation-delay:calc(var(--k) * 40ms);transition:transform .25s var(--ease)}
.pin.is-on{transform:scale(1.35);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 30%,transparent),0 1px 4px rgba(0,0,0,.3)}
.pier{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.pier svg{width:16px;height:16px}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.6)}}
.pop b{display:block;font-size:16px}
.pop span{display:block;color:var(--muted);font-size:13.5px;margin:2px 0 8px}
.pop .o-links{margin:0}

/* Segmented control */
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;margin:22px 0 0;padding:4px;border-radius:12px;background:var(--line)}
.seg button{position:relative;z-index:1;padding:9px 0;font-weight:600;font-size:15px;color:var(--muted);transition:color .2s;min-height:40px}
.seg button.on{color:var(--ink)}
.seg-pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:9px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);transition:transform .3s var(--ease)}
.seg.right .seg-pill{transform:translateX(100%)}

/* Filter chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:16px -20px 0;padding:2px 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:14.5px;min-height:40px;transition:background .2s,border-color .2s,color .2s}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[data-f="all"]::before{display:none}
.chip small{font-size:12.5px;color:var(--muted);font-weight:500}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.on small{color:inherit;opacity:.7}

/* Options */
.opts{list-style:none;margin:14px 0 0;padding:0;background:var(--surface);border-radius:16px;overflow:hidden}
.opt{border-top:1px solid var(--line);animation:rise .35s var(--ease) backwards;animation-delay:calc(var(--k) * 35ms);transition:background .25s}
.opt:first-child{border-top:0}
.opt.on{background:color-mix(in srgb,var(--c) 9%,var(--surface))}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.opt-main{display:flex;gap:12px;width:100%;text-align:left;padding:14px 16px 6px}
.o-dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:7px}
.o-text{display:block;min-width:0}
.o-name{font-weight:700;font-size:16.5px;margin-right:6px}
.tag{display:inline-block;vertical-align:2px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-right:4px}
.tag.pick{border-color:transparent;background:var(--c);color:var(--surface)}
.o-note{display:block;color:var(--muted);font-size:14.5px;margin-top:3px}
.o-links{display:flex;gap:8px;padding:4px 16px 14px 38px}
.o-links a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13.5px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--bg);min-height:34px}
.o-links svg{width:14px;height:14px}
.empty{padding:18px 16px;color:var(--muted);margin:0}

/* Plan */
.ptabs{display:flex;gap:8px;margin:16px 0 0}
.ptabs button{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:14.5px;min-height:38px}
.ptabs button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.plan{list-style:none;margin:16px 0 0;padding:6px 0;background:var(--surface);border-radius:16px;position:relative}
.plan li{display:grid;grid-template-columns:76px 1fr;gap:14px;padding:11px 16px;position:relative;animation:rise .35s var(--ease) backwards;animation-delay:calc(var(--k) * 45ms)}
.plan li::before{content:"";position:absolute;left:104px;top:18px;width:8px;height:8px;border-radius:50%;background:var(--ocean)}
.plan li::after{content:"";position:absolute;left:107px;top:28px;bottom:-12px;width:2px;background:var(--ocean-soft)}
.plan li:last-child::after{display:none}
.plan time{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.plan span{padding-left:22px}
.walk{margin:12px 2px 0;color:var(--muted);font-size:14.5px}

/* Sea */
.ideas{list-style:none;margin:20px 0 0;padding:6px 0;background:var(--surface);border-radius:16px}
.ideas li{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--line);animation:rise .35s var(--ease) backwards;animation-delay:calc(var(--k) * 45ms)}
.ideas li:first-child{border-top:0}
.ideas svg{flex:none;width:20px;height:20px;color:var(--ocean);margin-top:1px}

/* Prev / next */
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:28px}
.pn button{display:flex;flex-direction:column;padding:12px 16px;border-radius:14px;background:var(--surface);min-width:44%;text-align:left}
.pn button.next{text-align:right;margin-left:auto}
.pn small{color:var(--muted);font-size:13px}
.pn b{font-size:16px}
.hint{text-align:center;color:var(--muted);font-size:13px;margin:16px 0 0}

/* Checklist sheet */
.sheet{position:fixed;inset:0;z-index:2000}
.scrim{position:absolute;inset:0;background:rgba(5,20,18,.45);opacity:0;transition:opacity .3s}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 20px calc(28px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .38s var(--ease);max-width:560px;margin:0 auto}
.sheet.open .scrim{opacity:1}
.sheet.open .panel{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.panel-head{display:flex;justify-content:space-between;align-items:center}
.panel h2{font:400 30px/1.1 var(--serif);margin:0}
.close{padding:8px 14px;border-radius:999px;background:var(--surface);font-weight:600;min-height:38px}
.panel h3{font-size:17px;margin:24px 0 10px}
.box{background:var(--surface);border-radius:16px;margin:0;padding:4px 0;list-style:none}
.box li{padding:11px 16px;border-top:1px solid var(--line)}
.box li:first-child{border-top:0}
.dates li{display:grid;grid-template-columns:100px 1fr;gap:12px}
.dates b{font-size:14.5px}
.pack{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pack label{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:12px;padding:10px 12px;font-size:14.5px;cursor:pointer;min-height:44px}
.pack input{appearance:none;flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);margin:0;display:grid;place-items:center;transition:background .2s,border-color .2s}
.pack input:checked{background:var(--ocean);border-color:var(--ocean)}
.pack input:checked::after{content:"";width:5px;height:10px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.pack input:checked + span{color:var(--muted);text-decoration:line-through}
.budget{background:var(--surface);border-radius:16px;padding:14px 16px;margin:0}


/* Checkboxes, prices, day tally */
.opt-row{display:flex;align-items:flex-start}
.opt-row .opt-main{flex:1;min-width:0;width:auto}
.check{flex:none;width:48px;height:48px;margin:6px 6px 0 0;display:grid;place-items:center;border-radius:50%}
.check svg{width:28px;height:28px;transition:transform .15s}
.check:active svg{transform:scale(.86)}
.check .ring{fill:transparent;stroke:var(--muted);stroke-width:1.8;transition:fill .2s,stroke .2s}
.check .tick{fill:none;stroke:var(--surface);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:18;stroke-dashoffset:18;transition:stroke-dashoffset .28s var(--ease) .05s}
.check[aria-pressed="true"] .ring{fill:var(--c);stroke:var(--c)}
.check[aria-pressed="true"] .tick{stroke-dashoffset:0}
.opt.picked{background:color-mix(in srgb,var(--c) 6%,var(--surface))}
.o-meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:13.5px;font-weight:600}
.o-meta span{display:inline-flex;align-items:center;gap:5px}
.o-meta svg{width:15px;height:15px;color:var(--muted)}
.getting b{color:var(--ink);font-weight:700;white-space:nowrap}
.tally{position:fixed;left:0;right:0;bottom:0;z-index:900;padding:0 12px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.tally-dock{position:relative;max-width:536px;margin:0 auto;transition:transform .38s var(--ease),opacity .3s}
.tally-bar,.tally-panel,.tally-tuck,.tally-mini{pointer-events:auto}
.tally-tuck{position:absolute;right:22px;top:-26px;width:52px;height:28px;border-radius:14px 14px 0 0;background:var(--ink);color:var(--bg);display:grid;place-items:center;z-index:1}
.tally.open .tally-tuck{top:auto;bottom:62px;opacity:0;pointer-events:none}
.tally-tuck svg{width:18px;height:18px}
.tally-mini{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:6px;min-height:44px;padding:8px 12px 8px 16px;border-radius:999px;background:var(--ink);color:var(--bg);box-shadow:0 6px 20px rgba(0,0,0,.22);opacity:0;transform:translateY(16px) scale(.9);pointer-events:none;transition:opacity .25s,transform .35s var(--ease)}

.ptabs{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

  *,*::before,*::after{animation:none!important;transition:none!important}

<body>

<header class="hero">
  <div class="wrap">

        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5l1.5 1.5 3-3M2.5 11l1.5 1.5 3-3M9.5 5h4M9.5 11.5h4"/></svg>
        Checklist
      </button>
    </div>
    <h1>Hawaiʻi</h1>
    <p class="count" id="count">Carnival Radiance, Nov 8–22</p>
  </div>
</header>

<nav class="strip" id="strip" aria-label="Trip stops">
  <div class="track" id="track" role="tablist">

    <div class="wake" id="wake"></div>

      <svg viewBox="0 0 30 20" fill="currentColor"><path d="M2 12h26l-4 6H6z"/><path d="M8 7h13v4H8z" opacity=".75"/><path d="M15 3h3v4h-3z" opacity=".55"/></svg>
    </div>

<main class="wrap" id="main">
  <section id="dayHead" aria-live="polite"></section>
  <div class="mapwrap" id="mapWrap">

      <div class="m-zoom"><button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">−</button></div>

  </button>
  </div>

<script>
(function(){
  const T = window.TRIP, S = T.stops, C = T.categories;
  const $ = s => document.querySelector(s);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const darkMQ = matchMedia('(prefers-color-scheme: dark)');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let cur = -1, filter = 'all', view = 'options';
  let map = null, tiles = null, markers = [], pierMk = null;

  const packed = new Set();
  /* Checked activities start with the top picks */
  const picked = {};
  function usePreset(s, k){
    const names = s.presets[k].use;
    picked[s.id] = new Set((s.options || []).map((o, i) => names.includes(o.n) ? i : -1).filter(i => i >= 0));
  }
  S.forEach(s => {
    if (s.presets) usePreset(s, 0);
    else { picked[s.id] = new Set(); (s.options || []).forEach((o, i) => o.pick && picked[s.id].add(i)); }
  });

  /* Plan builder: orders checked stops, adds travel, checks the clock */
  const toRad = x => x * Math.PI / 180;
  function km(a, b){
    const dLat = toRad(b[0] - a[0]), dLon = toRad(b[1] - a[1]);
    const q = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.sin(dLon / 2) ** 2;
    return 2 * 6371 * Math.asin(Math.sqrt(q));
  }
  const mins = s => { const [a, b] = s.split(':').map(Number); return a * 60 + b; };
  function clock(m){ m = Math.round(m); let hh = Math.floor(m / 60) % 24; const mm = m % 60; const ap = hh >= 12 ? 'pm' : 'am'; hh = hh % 12 || 12; return hh + ':' + pad(mm) + ' ' + ap; }
  function hrs(m){ m = Math.round(m); const a = Math.floor(m / 60), b = m % 60; return a ? (b ? a + ' h ' + b + ' min' : a + ' h') : b + ' min'; }
  /* Breathing room: relaxed walking pace, padded drives, time at every stop */
  const BUF = {walkKmh: 4, walkPad: 3, drivePad: 1.15, park: 7, stop: 10, end: 10};
  function legBetween(s, a, b, pierLeg, extra){
    const L = s.leg, road = km(a, b) * 1.3;
    const walkMin = k => Math.max(3, Math.round(k / BUF.walkKmh * 60) + BUF.walkPad);
    if (L.mode === 'walk' && pierLeg && L.pierMi) return {type: 'walk', min: walkMin(L.pierMi * 1.609), mi: L.pierMi};
    if (road < 0.6) return {type: 'walk', min: walkMin(road), mi: road * 0.621};
    if (L.mode === 'car') return {type: 'drive', min: Math.max(5, Math.round(road / L.speed * 60 * BUF.drivePad)) + BUF.park + (extra || 0), mi: road * 0.621};
    if (road > 1.8) return {type: 'ride', min: 15 + Math.round(road / 30 * 60 * BUF.drivePad), mi: 0};
    return {type: 'walk', min: walkMin(road), mi: road * 0.621};
  }
  function buildPlan(s){
    if (!s.leg || !s.pier) return null;
    const sel = (s.options || []).map((o, i) => ({o, i})).filter(x => picked[s.id].has(x.i)).sort((a, b) => a.o.order - b.o.order);
    const st = {drive: 0, driveMi: 0, walk: 0, hike: 0, down: 0};
    const steps = [];
    const home = s.leg.mode === 'car' && s.rental && s.rental.ll ? s.rental.ll : s.pier.ll;
    let t = mins(s.ashore), pos = home, prev = null;
    steps.push({kind: 'start', at: t, text: 'Off the ship', sub: s.leg.mode === 'car' ? `About ${hrs(s.leg.start)} to get ashore, ride to the airport, and pick up the car` : `About ${hrs(s.leg.start)} to get ashore`});
    t += s.leg.start;
    const addLeg = l => {
      steps.push({kind: 'leg', l});
      t += l.min;
      if (l.type === 'drive'){ st.drive += l.min; st.driveMi += l.mi; }
      if (l.type === 'walk') st.walk += l.mi;
    };
    sel.forEach(({o, i}) => {
      addLeg(legBetween(s, pos, o.ll, !prev, (prev && prev.extra || 0) + (o.extra || 0)));
      let wait = 0, warn = '';
      if (o.at){ const a = mins(o.at); if (t <= a){ wait = a - t; t = a; } else warn = `Check-in is ${clock(a)}. You’d get there at ${clock(t)}.`; }
      if (o.by && t > mins(o.by)) warn = `Get here by ${clock(mins(o.by))}. You’d arrive at ${clock(t)}.`;
      steps.push({kind: 'stop', at: t, o, i, wait, warn});
      t += o.dur + BUF.stop;
      st.down += wait + BUF.stop + (o.c === 'chill' ? o.dur : 0);
      if (o.hike) st.hike += o.mi || 0; else st.walk += o.mi || 0;
      pos = o.ll; prev = o;
    });
    addLeg(legBetween(s, pos, home, true, prev && prev.extra || 0));
    t += s.leg.end + BUF.end;
    steps.push({kind: 'end', at: t, text: 'Back aboard', sub: s.leg.mode === 'car' ? 'Includes gas, returning the car, and the ride to the pier' : 'Includes getting back through the terminal'});
    const spare = mins(s.backBy) - t;
    if (spare > 0) st.down += spare;
    return {steps, st, end: t, spare, count: sel.length};
  }
  function dayStats(s){
    const plan = buildPlan(s);
    if (plan) return plan.st;
    let walk = 0, hike = 0;
    (s.options || []).forEach((o, i) => { if (picked[s.id].has(i)){ if (o.hike) hike += o.mi || 0; else walk += o.mi || 0; } });
    return {drive: 0, driveMi: 0, walk, hike, down: 0};
  }
  const usd = n => '$' + n.toLocaleString('en-US');
  const money = (lo, hi) => hi === 0 ? 'Free' : lo === hi ? usd(lo) : usd(lo) + '–' + hi.toLocaleString('en-US');
  const total = (lo, hi) => lo === hi ? usd(lo) : usd(lo) + '–' + hi.toLocaleString('en-US');
  const miles = m => (Math.round(m * 10) / 10) + ' mi';
  function dayTotals(s){
    let lo = 0, hi = 0, mi = 0; const items = [];
    (s.transport || []).forEach(t => { lo += t.lo; hi += t.hi; mi += t.mi || 0; items.push({n: t.n, lo: t.lo, hi: t.hi, fixed: true}); });
    (s.options || []).forEach((o, i) => { if (picked[s.id].has(i)){ lo += o.price[0]; hi += o.price[1]; mi += o.mi || 0; items.push({n: o.n, lo: o.price[0], hi: o.price[1]}); } });
    return {lo, hi, mi, items};
  }

  const ICON = {

  /* Hero countdown */

  function renderPane(){

  function pnHTML(){

  function renderDay(dir){
    const s = S[cur], head = $('#dayHead'), body = $('#dayBody'), mw = $('#mapWrap');

    mw.classList.remove('big'); $('#mapSize').textContent = 'Bigger map';

        [{opacity: 0, transform: `translateX(${dir * 28}px)`}, {opacity: 1, transform: 'none'}],
        {duration: 340, delay: k * 45, easing: 'cubic-bezier(.2,.75,.2,1)', fill: 'backwards'}));

  /* Map: drawn from coastline data, no map service or key needed */
  const GEO = window.GEO || {};
  const mapEl = $('#map'), svg = $('#mapSvg'), card = $('#mapCard');
  let mapZoom = false, mapSel = -1, lastRouteKey = '';
  let zk = 1, zc = null, mv = null;
  const ZMAX = 16;
  const routeCache = {};
  function routeStops(s){
    return (s.options || []).map((o, i) => ({o, i})).filter(x => picked[s.id].has(x.i)).sort((a, b) => (a.o.order || 0) - (b.o.order || 0));
  }
  function autoZoom(s){
    const g = GEO[s.geo];
    if (!g || !g.focus || !s.pier || !s.options) return false;
    const pts = [s.pier.ll, ...s.options.map(o => o.ll)];
    const span = Math.max(Math.max(...pts.map(q => q[0])) - Math.min(...pts.map(q => q[0])), Math.max(...pts.map(q => q[1])) - Math.min(...pts.map(q => q[1])));
    return span < 0.25 * Math.max(g.focus[2] - g.focus[0], g.focus[3] - g.focus[1]);
  }
  function frame(s){
    const g = GEO[s.geo];
    if (!mapZoom && g && g.focus) return g.focus;
    let pts = [s.pier.ll, ...(mapZoom ? routeStops(s).map(x => x.o.ll) : s.options.map(o => o.ll))];
    if (pts.length < 2) pts = [s.pier.ll, ...s.options.map(o => o.ll)];
    const xs = pts.map(q => q[1]), ys = pts.map(q => q[0]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const px = Math.max((x1 - x0) * .3, .02), py = Math.max((y1 - y0) * .3, .02);
    return [x0 - px, y0 - py, x1 + px, y1 + py * 1.6];
  }
  function drawMap(s, intro, routeIn){
    if (!s || !s.pier) return;
    const W = mapEl.clientWidth, H = mapEl.clientHeight;
    if (!W || !H) return;
    const f = frame(s), k = Math.cos((f[1] + f[3]) / 2 * Math.PI / 180);
    const X = lon => (lon - f[0]) * k * 1000, Y = lat => (f[3] - lat) * 1000;
    let vw = X(f[2]), vh = Y(f[1]), ox = 0, oy = 0;
    if (vw / vh > W / H){ const nh = vw * H / W; oy = (nh - vh) / 2; vh = nh; }
    else { const nw = vh * W / H; ox = (nw - vw) / 2; vw = nw; }
    /* pinch / drag zoom on top of the base view */
    const bx = -ox, by = -oy, w = vw / zk, hh = vh / zk;
    let c = zc || [bx + vw / 2, by + vh / 2];
    c = [Math.min(Math.max(c[0], bx + w / 2), bx + vw - w / 2), Math.min(Math.max(c[1], by + hh / 2), by + vh - hh / 2)];
    zc = zk > 1.001 ? c : null;
    mv = {x: c[0] - w / 2, y: c[1] - hh / 2, w, h: hh, W, H, bx, by, bw: vw, bh: vh};
    const u = w / W;
    svg.setAttribute('viewBox', `${mv.x.toFixed(2)} ${mv.y.toFixed(2)} ${w.toFixed(2)} ${hh.toFixed(2)}`);
    svg.style.touchAction = zk > 1.001 ? 'none' : 'pan-y';
    $('#zOut').disabled = zk <= 1.001; $('#zIn').disabled = zk >= ZMAX - .01;
    const P = ll => X(ll[1]).toFixed(1) + ',' + Y(ll[0]).toFixed(1);
    const g = GEO[s.geo];

    if (Math.abs(dx) > 70 && Math.abs(dy) < 50) select(cur + (dx < 0 ? 1 : -1));
  }, {passive: true});

  /* Packing lists, one per person plus shared */
  const PACK_TABS = [['bailey', 'Bailey'], ['luke', 'Luke'], ['shared', 'Both of us']];
  let packTab = 'bailey';
  const packKeys = who => T.checklist.packing[who].flatMap(([, items]) => items.map(x => who + ':' + x));
  function todoProgress(){
    const el = $('#todoProg'); if (!el) return;
    const keys = T.checklist.dates.map(([, t]) => 'todo:' + t), done = keys.filter(k => packed.has(k)).length;
    el.querySelector('span').textContent = done === keys.length ? 'All done' : `${done} of ${keys.length} done`;
    el.querySelector('i').style.setProperty('--p', (done / keys.length * 100) + '%');
  }
  function packProgress(){
    todoProgress();
    const el = $('#packProg'); if (!el) return;
    const keys = packKeys(packTab), done = keys.filter(k => packed.has(k)).length;
    el.querySelector('span').textContent = done === keys.length ? 'All packed' : `${done} of ${keys.length} packed`;
    el.querySelector('i').style.setProperty('--p', (done / keys.length * 100) + '%');
    PACK_TABS.forEach(([k]) => {
      const b = document.querySelector(`[data-ptab="${k}"]`), ks = packKeys(k);
      if (b) b.dataset.done = ks.every(x => packed.has(x)) ? 'yes' : '';
    });
  }
  function renderPack(){
    const box = $('#packList'); if (!box) return;
    const groups = T.checklist.packing[packTab];
    box.innerHTML = `<div class="pack-prog" id="packProg"><span></span><i></i></div>` +
      groups.map(([g, items]) => `<h4>${esc(g)}</h4><div class="pack">${items.map(x => {
        const key = packTab + ':' + x;
        return `<label><input type="checkbox" data-pack="${esc(key)}"${packed.has(key) ? ' checked' : ''}><span>${esc(x)}</span></label>`;
      }).join('')}</div>`).join('') +
      (packTab === 'shared' ? `<p class="box-p leave">${esc(T.checklist.leave)}</p>` : '');
    packProgress();
  }

  /* Checklist sheet */
  function buildSheet(){
    const L2 = T.checklist;
    $('#sheetBody').innerHTML = `
      <h3>To do</h3>
      <div class="pack-prog" id="todoProg"><span></span><i></i></div>
      <div class="todos">${L2.dates.map(([d, t, links]) => { const k = 'todo:' + t; return `<div class="todo-row"><label class="todo"><input type="checkbox" data-pack="${esc(k)}"${packed.has(k) ? ' checked' : ''}><span><small>${esc(d)}</small>${esc(t)}</span></label>${links ? `<div class="todo-links">${links.map(([l, u]) => u === '#pdf' ? `<button class="todo-pdf">${esc(l)}</button>` : `<a href="${u}" target="_blank" rel="noopener">${esc(l)}</a>`).join('')}</div>` : ''}</div>`; }).join('')}</div>
      <h3>Trip totals</h3>
      <div class="totals" id="totals"></div>
      <p class="tot-note">Based on what’s checked on each day. Downtime counts port days only.</p>
      <h3>No service?</h3>
      <p class="box-p">This page keeps working offline once you’ve opened it with service. For an extra backup, save every day’s plan as a PDF.</p>
      <button class="pdf-btn" id="pdfBtn">Save our plans as a PDF</button>
      <h3>Rental cars</h3>
      <div class="rent-days">${S.filter(s => s.rental).map(s => rentalHTML(s)).join('')}</div>
      <h3>Packing</h3>
      <p class="box-p">${esc(L2.packNote)}</p>
      <div class="ptabs pack-tabs" role="tablist">${PACK_TABS.map(([k, l]) => `<button data-ptab="${k}" class="${k === packTab ? 'on' : ''}">${l}</button>`).join('')}</div>
      <div id="packList"></div>
      <h3>Good to know</h3>
      <ul class="box">${L2.know.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  }
  const sheet = $('#sheet');
  let lastFocus = null;
  function openSheet(){
    lastFocus = document.activeElement;
    tripTotals();
    sheet.hidden = false; document.body.style.overflow = 'hidden';
    requestAnimationFrame(() => requestAnimationFrame(() => sheet.classList.add('open')));
    sheet.querySelector('.close').focus();
  }
  function closeSheet(){
    sheet.classList.remove('open'); document.body.style.overflow = '';
    setTimeout(() => { sheet.hidden = true; lastFocus && lastFocus.focus(); }, reduce ? 0 : 380);
  }
  $('#openList').addEventListener('click', openSheet);

  /* Printable backup of every plan */
  function printHTML(){
    const days = S.filter(s => s.leg && s.pier).map(s => {
      const P = buildPlan(s), c = dayTotals(s), date = fmt(s.date, {weekday: 'long', month: 'long', day: 'numeric'});
      const rows = P.steps.map(x => {
        if (x.kind === 'leg'){ const l = x.l; return `<tr class="pr-leg"><td></td><td>${l.type === 'drive' ? 'Drive' : l.type === 'ride' ? 'Taxi or rideshare' : 'Walk'} ${hrs(l.min)}${l.mi >= .2 ? ', ' + miles(l.mi) : ''}</td></tr>`; }
        if (x.kind === 'stop') return `<tr><td>${clock(x.at)}</td><td><b>${esc(x.o.n)}</b> (${hrs(x.o.dur)})<br><small>${esc(x.o.addr)}</small>${x.warn ? `<br><em>${esc(x.warn)}</em>` : ''}</td></tr>`;
        return `<tr><td>${clock(x.at)}</td><td><b>${x.text}</b></td></tr>`;
      }).join('');
      return `<section class="pr-day"><h2>${esc(s.place)}</h2><p>${date}. Ashore ${t12(s.ashore)}, aboard by ${t12(s.backBy)}, ship leaves ${t12(s.depart)}.</p>
        ${P.count ? `<table>${rows}</table><p>Back aboard around ${clock(P.end)}. About ${total(c.lo, c.hi)} for two. ${s.getting ? esc(s.getting) : ''}</p>` : '<p>Nothing checked for this day yet.</p>'}
        ${(s.heads || []).length ? `<ul>${s.heads.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</section>`;
    }).join('');
    return `<h1>Bailey + Luke in Hawaiʻi</h1><p>Carnival Radiance, November 8–22. Saved ${new Date().toLocaleDateString('en-US', {month: 'long', day: 'numeric'})}. Times are estimates.</p>${days}
      <section class="pr-day"><h2>Good to know</h2><ul>${T.checklist.know.map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>`;
  }
  $('#sheetBody').addEventListener('click', e => {
    if (!e.target.closest('#pdfBtn, .todo-pdf')) return;
    $('#printOut').innerHTML = printHTML();
    setTimeout(() => window.print(), 50);
  });
  sheet.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !sheet.hidden) closeSheet();
    if (sheet.hidden && (e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !e.target.closest('input, #map'))
      select(cur + (e.key === 'ArrowRight' ? 1 : -1));
  });

  /* Shared check marks (Firebase Realtime Database, REST + live stream) */
  const SY = window.SYNC || {};
  const base = (SY.url || '').trim().replace(/\/+$/, '');
  const syncOn = /^https:\/\//.test(base);
  const tripUrl = () => `${base}/trips/${encodeURIComponent(SY.trip || 'trip')}.json`;
  let pending = {}, flushT = 0, retryT = 0;
  function namesFor(s){ return '|' + [...picked[s.id]].map(i => s.options[i].n).join('|'); }
  function fromNames(s, str){
    const names = str.split('|').filter(Boolean);
    picked[s.id] = new Set(s.options.map((o, i) => names.includes(o.n) ? i : -1).filter(i => i >= 0));
  }
  function setStatus(st){
    const el = $('#sync'); if (!syncOn) return;
    el.hidden = false; el.dataset.st = st;
    el.textContent = st === 'ok' ? 'Synced' : st === 'saving' ? 'Saving' : 'Offline';
    el.title = st === 'error' ? 'Saved on this phone. Syncs when you’re back online.' : '';
  }
  /* Keep a copy of everything on this phone so it works with no service */
  const STATE_KEY = './__trip-state';
  async function saveLocal(){
    try {
      if (!window.caches) return;
      const days = {};
      S.forEach(s => { if (s.options && s.options.length) days[s.id] = namesFor(s); });
      const c = await caches.open('hawaii-trip-state');
      await c.put(STATE_KEY, new Response(JSON.stringify({days, pack: '|' + [...packed].join('|'), pending}), {headers: {'Content-Type': 'application/json'}}));
    } catch (e){}
  }
  async function loadLocal(){
    try {
      if (!window.caches) return null;
      const r = await (await caches.open('hawaii-trip-state')).match(STATE_KEY);
      return r ? r.json() : null;
    } catch (e){ return null; }
  }
  function applyPending(p){
    Object.keys(p || {}).forEach(k => {
      if (k === 'pack'){ packed.clear(); p[k].split('|').filter(Boolean).forEach(x => packed.add(x)); }
      else if (k.startsWith('days/')){ const s = S.find(x => x.id === k.slice(5)); if (s && s.options) fromNames(s, p[k]); }
    });
  }
  function queue(path, value){
    if (syncOn){
      pending[path] = value;
      clearTimeout(flushT); flushT = setTimeout(flush, 350);
      setStatus('saving');
    }
    saveLocal();
  }
  async function flush(){
    const body = pending; pending = {};
    if (!Object.keys(body).length) return;
    try {
      const r = await fetch(tripUrl(), {method: 'PATCH', body: JSON.stringify(body)});
      if (!r.ok) throw new Error(r.status);
      setStatus(Object.keys(pending).length ? 'saving' : 'ok');
      saveLocal();
    } catch (e){
      pending = Object.assign(body, pending);
      saveLocal();
      setStatus('error');
      clearTimeout(retryT); retryT = setTimeout(flush, 5000);
    }
  }
  function applyRemote(d){
    if (!d) return;
    if (d.days) S.forEach(s => { if (typeof d.days[s.id] === 'string' && s.options) fromNames(s, d.days[s.id]); });
    if (typeof d.pack === 'string'){ packed.clear(); d.pack.split('|').filter(Boolean).forEach(x => packed.add(x)); }
  }
  function refreshUI(){
    if (cur >= 0 && S[cur].kind !== 'sea'){
      const pane = $('#pane');
      if (pane){ pane.classList.add('quiet'); renderPane(); setTimeout(() => pane.classList.remove('quiet'), 50); }
      updateTally(false);
      drawMap(S[cur]);
    }
    document.querySelectorAll('[data-pack]').forEach(b => b.checked = packed.has(b.dataset.pack));
    packProgress();
    if (!sheet.hidden) tripTotals(true);
  }
  async function pull(){
    const r = await fetch(tripUrl());
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }
  async function startSync(){
    const local = await loadLocal();
    if (local){
      applyRemote(local);
      if (syncOn) pending = Object.assign({}, local.pending || {});
      refreshUI();
    }
    if (!syncOn) return;
    setStatus('saving');
    try {
      const d = await pull();
      if (d && d.days){
        applyRemote(d);
        applyPending(pending);
        refreshUI(); saveLocal();
        if (Object.keys(pending).length) flush();
      }
      else {
        const init = {days: {}, pack: '|' + [...packed].join('|')};
        S.forEach(s => { if (s.options && s.options.length) init.days[s.id] = namesFor(s); });
        const r = await fetch(tripUrl(), {method: 'PUT', body: JSON.stringify(init)});
        if (!r.ok) throw new Error(r.status);
      }
      setStatus('ok');
    } catch (e){ setStatus('error'); }
    if (!window.EventSource) return;
    const es = new EventSource(tripUrl());
    const onChange = async () => {
      if (Object.keys(pending).length) return;
      try { applyRemote(await pull()); refreshUI(); saveLocal(); setStatus('ok'); } catch (e){}
    };
    es.addEventListener('put', onChange);
    es.addEventListener('patch', onChange);
    es.addEventListener('open', () => setStatus('ok'));
    es.addEventListener('error', () => setStatus('error'));
  }
  $('#sheetBody').addEventListener('change', e => {
    const b = e.target.closest('[data-pack]'); if (!b) return;
    b.checked ? packed.add(b.dataset.pack) : packed.delete(b.dataset.pack);
    packProgress();
    queue('pack', '|' + [...packed].join('|'));
  });
  $('#sheetBody').addEventListener('click', e => {
    const t = e.target.closest('[data-ptab]'); if (!t || t.dataset.ptab === packTab) return;
    packTab = t.dataset.ptab;
    document.querySelectorAll('[data-ptab]').forEach(b => b.classList.toggle('on', b.dataset.ptab === packTab));
    renderPack();
  });

  /* Start */
  hero(); buildStrip(); buildSheet(); renderPack(); startSync();
  window.addEventListener('online', () => { if (syncOn && Object.keys(pending).length) flush(); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  let start = S.findIndex(s => s.id === location.hash.slice(1));
  if (start < 0) start = todayIdx();
  if (start < 0) start = S.findIndex(s => s.id === 'maui');
  placeLine(0);
  track.getBoundingClientRect();
  track.classList.add('intro', 'ready');
  select(start);
  setTimeout(() => track.classList.remove('intro'), 1800);
  const relayout = () => { if (cur >= 0) placeLine(cur); };
  window.addEventListener('resize', relayout);
  document.fonts && document.fonts.ready.then(relayout);
})();
</script>
</body>
</html>
